author      = "Nilsonlinux"
license     = "MIT"
icon        = "rss"
description = "Monitors RSS/Atom feeds and notifies you when new items appear."
tags        = ["productivity", "utility", "indicator", "panel", "bar", "service"]
dependencies = ["xdg-open"]

