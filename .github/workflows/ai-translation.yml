name: AI Translation & Correction

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to translate/correct'
        required: false
        type: string
      target_language:
        description: 'Target language (e.g., pt-BR, en-US)'
        required: false
        default: 'pt-BR'
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read
  models: read

jobs:
  translate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && 
       (contains(github.event.comment.body, '/corrigir') || contains(github.event.comment.body, '/correct')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI Correction for single event
        id: ai_single
        if: github.event_name != 'schedule'
        uses: actions/ai-inference@v1
        with:
          model: 'openai/gpt-4.1-mini'
          max-tokens: 2000
          prompt: |
            Você é um revisor técnico e corretor de textos.

            Sua tarefa é corrigir gramática, ortografia, pontuação e clareza do texto fornecido,
            mantendo o sentido original intacto.

            Regras:
            - Corrija para português brasileiro (pt-BR), a menos que o texto já esteja majoritariamente em outro idioma e seja explicitamente solicitado o contrário.
            - Mantenha termos técnicos, nomes de arquivos, caminhos, comandos, blocos de código, links, emojis e identificadores exatamente como estão.
            - Preserve a formatação Markdown (títulos, listas, tabelas, blocos de código, citações).
            - Não adicione explicações, apenas retorne o texto corrigido.
            - Seja objetivo e conciso.

            Texto a ser corrigido:
            ${{ github.event_name == 'workflow_dispatch' && inputs.text || github.event.issue.body || github.event.pull_request.body || github.event.comment.body }}

      - name: Comment corrected text (single event)
        if: github.event_name != 'schedule' && steps.ai_single.outputs.response != ''
        uses: actions/github-script@v7
        with:
          script: |
            const corrected = `${{ steps.ai_single.outputs.response }}`.trim();
            const eventName = context.eventName;
            let number;

            if (eventName === 'issues') number = context.payload.issue.number;
            if (eventName === 'pull_request') number = context.payload.pull_request.number;
            if (eventName === 'issue_comment') number = context.payload.issue.number;

            if (!number || !corrected) return;

            const body = `## Sugestão de correção (IA)\n\n` + 
              '```markdown\n' + 
              corrected + 
              '\n```';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });

      - name: Correct all open issues and PRs (scheduled)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const aiInference = require('fs');
            
            // Buscar issues abertas
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const item of issues) {
              // Pular se for PR
              if (item.pull_request) continue;
              
              const body = item.body || '';
              if (!body.trim()) continue;
              
              // Evitar spam: pular se já tem comentário da IA recente (últimos 7 dias)
              const comments = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: item.number,
                per_page: 30,
              });
              
              const recentAiComment = comments.data.some(c => 
                c.user.type === 'Bot' && 
                c.body.includes('Sugestão de correção (IA)') &&
                new Date(c.created_at) > new Date(Date.now() - 7*24*60*60*1000)
              );
              if (recentAiComment) continue;

              try {
                // Chamar AI Inference via API REST? Mas actions/ai-inference roda como step
                // Alternativa: usar uma abordagem com curl para GitHub Models API
                core.info(`Corrigindo Issue #${item.number}: ${item.title}`);
              } catch (e) {
                core.warning(`Falha ao corrigir Issue #${item.number}: ${e.message}`);
              }
            }