name: AI Translation & Correction

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      text:
        description: 'Text to translate/correct'
        required: false
        type: string
      target_language:
        description: 'Target language (e.g., pt-BR, en-US)'
        required: false
        default: 'pt-BR'
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read
  models: read

jobs:
  translate:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && 
       (contains(github.event.comment.body, '/corrigir') || contains(github.event.comment.body, '/correct')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AI Correction for single event
        id: ai_single
        if: github.event_name != 'schedule'
        uses: actions/ai-inference@v1
        with:
          model: 'openai/gpt-4.1-mini'
          max-tokens: 2000
          prompt: |
            Você é um revisor técnico e corretor de textos.

            Sua tarefa é corrigir gramática, ortografia, pontuação e clareza do texto fornecido,
            mantendo o sentido original intacto.

            Regras:
            - Corrija para português brasileiro (pt-BR), a menos que o texto já esteja majoritariamente em outro idioma e seja explicitamente solicitado o contrário.
            - Mantenha termos técnicos, nomes de arquivos, caminhos, comandos, blocos de código, links, emojis e identificadores exatamente como estão.
            - Preserve a formatação Markdown (títulos, listas, tabelas, blocos de código, citações).
            - Não adicione explicações, apenas retorne o texto corrigido.
            - Seja objetivo e conciso.

            Texto a ser corrigido:
            ${{ github.event_name == 'workflow_dispatch' && inputs.text || github.event.issue.body || github.event.pull_request.body || github.event.comment.body }}

      - name: Comment corrected text (single event)
        if: github.event_name != 'schedule' && steps.ai_single.outputs.response != ''
        uses: actions/github-script@v7
        with:
          script: |
            const corrected = `${{ steps.ai_single.outputs.response }}`.trim();
            const eventName = context.eventName;
            let number;

            if (eventName === 'issues') number = context.payload.issue.number;
            if (eventName === 'pull_request') number = context.payload.pull_request.number;
            if (eventName === 'issue_comment') number = context.payload.issue.number;

            if (!number || !corrected) return;

            const body = `## Sugestão de correção (IA)\n\n` + 
              '```markdown\n' + 
              corrected + 
              '\n```';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });

      - name: Correct all open issues and PRs (scheduled)
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const model = 'openai/gpt-4.1-mini';
            const cooldownDays = 7;
            const cooldownMs = cooldownDays * 24 * 60 * 60 * 1000;

            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const systemPrompt = `Você é um revisor técnico e corretor de textos.

Sua tarefa é corrigir gramática, ortografia, pontuação e clareza do texto fornecido, mantendo o sentido original intacto.

Regras:
- Corrija para português brasileiro (pt-BR), a menos que o texto já esteja majoritariamente em outro idioma.
- Mantenha termos técnicos, nomes de arquivos, caminhos, comandos, blocos de código, links, emojis e identificadores exatamente como estão.
- Preserve a formatação Markdown (títulos, listas, tabelas, blocos de código, citações).
- Não adicione explicações, apenas retorne o texto corrigido.
- Seja objetivo e conciso.`;

            for (const item of items) {
              const isPR = Boolean(item.pull_request);
              const number = item.number;
              const title = item.title || '';
              const body = item.body || '';

              const textToCorrect = `Título: ${title}\n\n${body}`.trim();
              if (!textToCorrect) continue;

              try {
                const comments = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 50,
                });

                const hasRecentAiComment = comments.data.some((c) => {
                  const isBot = c.user?.type === 'Bot' || c.user?.login?.endsWith('[bot]');
                  const hasMarker = c.body?.includes('Sugestão de correção (IA)');
                  const createdAt = new Date(c.created_at).getTime();
                  return isBot && hasMarker && createdAt > Date.now() - cooldownMs;
                });

                if (hasRecentAiComment) {
                  core.info(`${isPR ? 'PR' : 'Issue'} #${number}: pulado (comentário IA recente)`);
                  continue;
                }

                const response = await fetch('https://models.github.ai/inference/chat/completions', {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                    'Content-Type': 'application/json',
                    'User-Agent': 'github-actions-ai-correction',
                  },
                  body: JSON.stringify({
                    model,
                    messages: [
                      { role: 'system', content: systemPrompt },
                      { role: 'user', content: textToCorrect },
                    ],
                    temperature: 0.1,
                    max_tokens: 2000,
                  }),
                });

                if (!response.ok) {
                  const errText = await response.text();
                  core.warning(`${isPR ? 'PR' : 'Issue'} #${number}: falha na API (${response.status}) - ${errText}`);
                  continue;
                }

                const data = await response.json();
                const corrected = data.choices?.[0]?.message?.content?.trim();

                if (!corrected) {
                  core.info(`${isPR ? 'PR' : 'Issue'} #${number}: sem resposta da IA`);
                  continue;
                }

                if (corrected === textToCorrect) {
                  core.info(`${isPR ? 'PR' : 'Issue'} #${number}: sem alterações necessárias`);
                  continue;
                }

                const commentBody =
                  `## Sugestão de correção (IA)\n\n` +
                  '```markdown\n' +
                  corrected +
                  '\n```';

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body: commentBody,
                });

                core.info(`${isPR ? 'PR' : 'Issue'} #${number}: sugestão de correção publicada`);
              } catch (error) {
                core.warning(`${isPR ? 'PR' : 'Issue'} #${number}: erro - ${error.message}`);
              }
            }