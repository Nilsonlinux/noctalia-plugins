name: Generate Catalog

on:
  push:
    paths:
      - '**/plugin.toml'
      - '**/thumbnail.webp'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # ⬅️ ADICIONADO para criar issues

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # ⬅️ Mudado para 2 para ter acesso ao commit anterior
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Generate catalog.toml
        run: |
          cat > generate_catalog.py << 'EOF'
          # COLE AQUI O SCRIPT update-catalog.py COMPLETO
          EOF
          
          python3 generate_catalog.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git add catalog.toml
          if git diff --cached --quiet catalog.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to catalog.toml"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in catalog.toml"
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update plugin catalog [skip ci]"
          git pull --rebase
          git push
      
      - name: Create issue about catalog changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cat > create_issue.py << 'EOF'
          # COLE AQUI O SCRIPT create-release-issue.py ACIMA
          EOF
          
          python3 create_issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
