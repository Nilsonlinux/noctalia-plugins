name: Generate Catalog

on:
  push:
    paths:
      - '**/plugin.toml'
      - '**/thumbnail.webp'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: List files before generation
        run: |
          echo "📂 Estrutura de diretórios:"
          ls -la
          echo ""
          echo "📁 Pastas de plugins:"
          ls -d */ 2>/dev/null || echo "Nenhuma pasta encontrada"
          echo ""
          echo "📄 Arquivos plugin.toml:"
          find . -name "plugin.toml" 2>/dev/null || echo "Nenhum plugin.toml encontrado"
      
      - name: Generate catalog.toml
        run: |
          # Criar o script generate_catalog.py
          cat > generate_catalog.py << 'EOF'
          # COLE AQUI O SCRIPT ADAPTADO (COM DEBUG)
          EOF
          
          echo "🚀 Executando script..."
          python3 generate_catalog.py
          
          echo ""
          echo "📄 Conteúdo do catalog.toml gerado:"
          cat catalog.toml || echo "❌ catalog.toml não foi criado!"
      
      - name: Check if catalog.toml exists
        run: |
          if [ -f "catalog.toml" ]; then
            echo "✅ catalog.toml existe"
            echo "📊 Tamanho: $(wc -c < catalog.toml) bytes"
            echo "📝 Linhas: $(wc -l < catalog.toml) linhas"
          else
            echo "❌ catalog.toml NÃO foi criado!"
            exit 1
          fi
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          echo "📊 Status do git:"
          git status
          
          echo ""
          echo "📊 Diff do catalog.toml:"
          git diff catalog.toml || echo "Sem diferenças"
          
          git add catalog.toml
          
          if git diff --staged --quiet; then
            echo "ℹ️ Nenhuma mudança para commitar"
          else
            git commit -m "🔄 Generate catalog.toml [skip ci]"
            git push
            echo "✅ Commit e push realizados!"
          fi
