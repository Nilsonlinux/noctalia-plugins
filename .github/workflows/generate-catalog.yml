name: Generate Catalog

on:
  push:
    paths:
      - '**/plugin.toml'
      - '**/thumbnail.webp'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate catalog.toml
        run: |
          # Criar o script generate_catalog.py
          cat > generate_catalog.py << 'EOF'
          # COLE AQUI O SCRIPT ADAPTADO ACIMA
          EOF
          
          # Executar o script
          python3 generate_catalog.py
      
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add catalog.toml
          git diff --staged --quiet || git commit -m "🔄 Generate catalog.toml [skip ci]"
          git push
